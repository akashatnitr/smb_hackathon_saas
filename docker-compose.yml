version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smb_saas_postgres
    environment:
      POSTGRES_USER: smbuser
      POSTGRES_PASSWORD: smbpass
      POSTGRES_DB: smb_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smbuser -d smb_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smb_saas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
